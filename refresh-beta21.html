<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aggiornamento Volley Scout</title><style>body{font:16px system-ui;background:#f4f5fa;color:#17233b;display:grid;place-items:center;min-height:90vh;text-align:center}main{background:white;border-radius:20px;padding:28px;max-width:340px}button{background:#3449e8;color:white;border:0;padding:14px 20px;border-radius:12px;font-weight:bold}</style></head><body><main><h2>🏐 Volley Scout</h2><p id="status">Aggiornamento alla Beta 21 in corso…</p><button onclick="location.replace('./index.html?release=21-refresh2')">Apri Volley Scout</button></main><script>(async()=>{try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('volley-scout-')).map(k=>caches.delete(k)))}document.getElementById('status').textContent='Cache aggiornata. Apertura Beta 21…';location.replace('./index.html?release=21-refresh2')}catch(e){document.getElementById('status').textContent='Premi Apri Volley Scout per continuare.'}})()</script></body></html>
